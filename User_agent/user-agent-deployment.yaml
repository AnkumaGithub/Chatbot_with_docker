apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-agent
  template:
    metadata:
      labels:
        app: user-agent
    spec:
      containers:
      - name: user-agent-container
        image: user-agent-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MEDICAL_AGENT_URL
          value: "http://medical-agent-service:8000"
        - name: LLM_SERVICE_URL
          value: "http://api-service:8000"
        resources:
          limits:
            memory: "512Mi"
            cpu: "0.5"
          requests:
            memory: "256Mi"
            cpu: "0.2"

---
apiVersion: v1
kind: Service
metadata:
  name: user-agent-service
spec:
  selector:
    app: user-agent
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000